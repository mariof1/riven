services:
    # Frontend container also hosts an embedded Postgres instance for Riven.
    riven_frontend:
        # Use the upstream image if it contains embedded Postgres, or build from ./frontend.
        image: spoked/riven-frontend:latest
        container_name: riven-frontend
        restart: unless-stopped
        tty: true
        environment:
            - TZ=${TZ:-Etc/UTC}
            - ORIGIN=http://localhost:3000
            # Server-side calls from the frontend container to the backend container.
            - BACKEND_URL=http://riven:8080
            # Must match the backend API_KEY.
            - BACKEND_API_KEY=${RIVEN_API_KEY:-dev_only_change_me_1234567890123}
            # Replace for any real deployment (must be >= 32 chars).
            - AUTH_SECRET=${FRONTEND_AUTH_SECRET:-dev_auth_secret_change_me_123456}
            # Embedded Postgres config (used by backend)
            - PGDATA=/riven/data/postgres
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=riven
        ports:
            - 3000:3000
        volumes:
            - /path/to/riven/frontend:/riven/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 10

    riven:
        image: spoked/riven:latest
        container_name: riven
        restart: unless-stopped
        ports:
            - "8080:8080"
        tty: true
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        shm_size: 1024m
        devices:
            - /dev/fuse
        environment:
            - PUID=${PUID:-1000}
            - PGID=${PGID:-1000}
            - TZ=${TZ:-America/New_York}
            - RIVEN_FORCE_ENV=true
            # Must match the frontend's embedded Postgres credentials.
            - RIVEN_DATABASE_HOST=postgresql+psycopg2://postgres:postgres@riven_frontend:5432/riven
            # Must match the frontend's BACKEND_API_KEY.
            - API_KEY=${RIVEN_API_KEY:-dev_only_change_me_1234567890123}
        healthcheck:
            test: curl -s http://localhost:8080 >/dev/null || exit 1
            interval: 30s
            timeout: 10s
            retries: 10
        volumes:
            - /path/to/riven/data:/riven/data
            - /path/to/riven/mount:/mount:rshared,z
        depends_on:
            riven_frontend:
                condition: service_healthy

    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        user: 1000:1000
        restart: unless-stopped
        ports:
        - "8096:8096"
        volumes:
        - /path/to/jellyfin/config:/config
        - /path/to/riven/mount:/mount:rslave,z
