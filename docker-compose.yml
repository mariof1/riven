services:
    # Single-container monolith (backend + frontend + embedded Postgres)
    #
    # Notes:
    # - Frontend UI is exposed on http://localhost:3000
    # - Backend API is internal-only (not published to host)
    # - Postgres runs inside the same container
    # - Mount propagation is handled inside the container (no host :rshared required)
    riven:
        # For self-host, build from this repo.
        build:
            context: .
            dockerfile: Dockerfile.monolith
            args:
                NODE_VERSION: ${NODE_VERSION:-24.0.0}
        # Alternatively, if you publish a monolith image, replace the build with:
        # image: yourname/riven-monolith:latest
        image: riven-monolith:local
        container_name: riven
        restart: unless-stopped
        tty: true
        shm_size: 1024m

        ports:
            - "3000:3000"
            # Optional Plex (enable first via env):
            # - "32400:32400"

        environment:
            # Minimal env. Secrets are generated on first boot and persisted under /riven/data.
            - TZ=${TZ:-Etc/UTC}

            # Media server selection:
            # - none (default)
            # - plex
            - RIVEN_MEDIA_FLAVOR=${RIVEN_MEDIA_FLAVOR:-none}

            # Plex (optional): provide any env vars Plex needs.
            # Plex is proprietary; this container can install it at runtime if you set:
            # - PLEX_DEB_URL (direct .deb URL)
            # - PLEX_CLAIM (optional claim token)
            - PLEX_DEB_URL=${PLEX_DEB_URL:-}
            - PLEX_CLAIM=${PLEX_CLAIM:-}

        devices:
            - /dev/fuse
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined

        volumes:
            # Persistent data (secrets, DB, logs, caches)
            - /path/to/riven/data:/riven/data
            # Mount root used by RivenVFS (no host propagation flags required)
            - /path/to/riven/mount:/mount
