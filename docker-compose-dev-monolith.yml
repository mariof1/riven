# Single-container dev monolith.
#
# Usage:
#   docker compose -f docker-compose-dev-monolith.yml up -d --build
#
# Notes:
# - Backend API is internal-only (localhost inside container).
# - Frontend UI is exposed on http://localhost:3000
# - Postgres runs inside the same container.
# - Plex is optional (proprietary): enabled via RIVEN_MEDIA_FLAVOR=plex and PLEX_DEB_URL.

services:
  riven_monolith:
    build:
      context: .
      dockerfile: Dockerfile.monolith
      args:
        # Pin Node runtime (tarball) version in final stage.
        NODE_VERSION: ${NODE_VERSION:-24.0.0}
    image: riven-monolith-local:dev
    container_name: riven-monolith
    restart: unless-stopped
    tty: true
    shm_size: 1024m
    ports:
      - "3000:3000"
      # Optional Plex UI/clients (enable Plex first):
      # - "32400:32400"
    environment:
      # Keep env minimal. Most secrets are generated on first boot and persisted under /riven/data/secrets.
      - TZ=${TZ:-UTC}

      # Public URL used by the frontend auth/OAuth flows (used to set ORIGIN inside the container).
      # Example: http://10.10.101.102:3000
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}

      # DB password must be user-provided (set in .env). This is used to set/rotate
      # the embedded Postgres role password and to build the backend connection string.
      - RIVEN_DB_PASSWORD=${RIVEN_DB_PASSWORD:-}

      # Optional feature selection:
      # - none (default)
      # - plex
      # - all (reserved)
      - RIVEN_MEDIA_FLAVOR=${RIVEN_MEDIA_FLAVOR:-none}

      # Optional Plex vars (only used if RIVEN_MEDIA_FLAVOR=plex):
      # - PLEX_DEB_URL=https://downloads.plex.tv/.../plexmediaserver_*.deb
      # - PLEX_CLAIM=claim-xxxx
      - PLEX_DEB_URL=${PLEX_DEB_URL:-}
      - PLEX_CLAIM=${PLEX_CLAIM:-}

      # Auth provider toggles (frontend Better Auth):
      # Allow first-time login via Plex OAuth by default for devbox setups.
      - ENABLE_PLEX_SIGNUP=${ENABLE_PLEX_SIGNUP:-true}

      # Optional override: where persistent data is stored inside container.
      - RIVEN_DATA_DIR=/riven/data

      # Monolith mode: filesystem mount path is fixed and managed by the container.
      - RIVEN_MONOLITH=true
      - RIVEN_FILESYSTEM_MOUNT_PATH=/mount

    volumes:
      - ./container_data/monolith:/riven/data
