# Full local dev stack (backend + frontend) from a single repo checkout.
#
# Usage:
#   docker compose -f docker-compose-dev-full.yml up -d --build
#   docker compose -f docker-compose-dev-full.yml down
#
# Notes:
# - Backend runs on http://localhost:8080
# - Frontend runs on http://localhost:3000
# - Backend image is built from this repo root.
# - Frontend image is built from ./frontend

services:
  riven:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    image: riven-local:dev
    container_name: riven
    restart: unless-stopped
    tty: true
    shm_size: 1024m
    ports:
      - "8080:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      # For local dev we keep ORIGIN at the backend URL.
      - ORIGIN=${RIVEN_ORIGIN:-http://localhost:8080}
      - RIVEN_FORCE_ENV=true
      # DB is hosted inside the frontend container (embedded Postgres).
      - RIVEN_DATABASE_HOST=postgresql+psycopg2://postgres:postgres@riven_frontend:5432/riven
      # Backend API key (32 chars). Frontend must use the same value.
      - API_KEY=${RIVEN_API_KEY:-dev_only_change_me_1234567890123}
    healthcheck:
      test: curl -s http://localhost:8080 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./container_data/riven:/riven/data
      # Optional: set RIVEN_MOUNT_BIND_OPTS=':rshared' if you need mount propagation.
      - ./container_data/mount:/mount${RIVEN_MOUNT_BIND_OPTS:-}

  riven_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: riven-frontend-local:dev
    container_name: riven-frontend
    restart: unless-stopped
    tty: true
    ports:
      - "3000:3000"
    environment:
      - TZ=${TZ:-UTC}
      - ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      # Server-side calls from the frontend container to the backend container.
      - BACKEND_URL=http://riven:8080
      # Must match the backend's API_KEY.
      - BACKEND_API_KEY=${RIVEN_API_KEY:-dev_only_change_me_1234567890123}
      # Frontend persists its sqlite db here.
      - DATABASE_URL=/riven/data/riven.db
      # Replace for any real deployment.
      - AUTH_SECRET=${FRONTEND_AUTH_SECRET:-dev_auth_secret_change_me_123456}
      # Embedded Postgres config (used by backend)
      - PGDATA=/riven/data/postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=riven
    volumes:
      - ./container_data/frontend:/riven/data

