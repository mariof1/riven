# Dev stack without a bundled Postgres container.
#
# IMPORTANT: Riven backend requires PostgreSQL. This compose expects you to provide
# an existing Postgres instance (hosted on the Docker host, or another container/network).
#
# Usage:
#   export RIVEN_DATABASE_HOST='postgresql+psycopg2://postgres:postgres@HOST:5432/riven'
#   docker compose -f docker-compose-dev-nodb.yml up -d --build
#
# Services:
# - Backend:  http://localhost:8080
# - Frontend: http://localhost:3000

services:
  riven:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    image: riven-local:dev
    container_name: riven
    restart: unless-stopped
    tty: true
    shm_size: 1024m
    ports:
      - "8080:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - ORIGIN=${RIVEN_ORIGIN:-http://localhost:8080}
      - RIVEN_FORCE_ENV=true
      - RIVEN_DATABASE_HOST=${RIVEN_DATABASE_HOST:?Set RIVEN_DATABASE_HOST to a postgresql+psycopg2 URL}
      # Backend API key (32 chars). Frontend must use the same value.
      - API_KEY=${RIVEN_API_KEY:-dev_only_change_me_1234567890123}
    healthcheck:
      test: curl -s http://localhost:8080 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./container_data/riven:/riven/data
      # Optional: set RIVEN_MOUNT_BIND_OPTS=':rshared' if you need mount propagation.
      - ./container_data/mount:/mount${RIVEN_MOUNT_BIND_OPTS:-}

  riven_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: riven-frontend-local:dev
    container_name: riven-frontend
    restart: unless-stopped
    tty: true
    ports:
      - "3000:3000"
    environment:
      - TZ=${TZ:-UTC}
      - ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - BACKEND_URL=http://riven:8080
      - BACKEND_API_KEY=${RIVEN_API_KEY:-dev_only_change_me_1234567890123}
      - DATABASE_URL=/riven/data/riven.db
      - AUTH_SECRET=${FRONTEND_AUTH_SECRET:-dev_auth_secret_change_me_123456}
    volumes:
      - ./container_data/frontend:/riven/data
    depends_on:
      riven:
        condition: service_healthy
